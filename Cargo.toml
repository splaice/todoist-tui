[package]
name = "todoist-tui"
version = "0.1.0"
edition = "2024"
description = "A full-screen terminal client for Todoist"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = "2.12"

[[bin]]
name = "tt"
path = "src/main.rs"
